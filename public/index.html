<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANYTREE 관리비 대시보드</title>
    <!-- 제니트리 디자인 시스템 v5.0 적용 -->
    <link rel="stylesheet" href="https://design.janytree.com/v5/jt-tokens.css">
    <link rel="stylesheet" href="https://design.janytree.com/v5/jt-utilities.css">
    <!-- Google Material Symbols Rounded (아이콘) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Supabase 클라이언트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js 라이브러리 (비교 그래프용) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 전역 설정 */
        body {
            background-color: var(--jt-color-bg, #F5F6F8);
            color: var(--jt-color-text, #1F2328);
            font-family: var(--jt-font-body, Pretendard, sans-serif);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 아이콘 공통 스타일 */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: currentColor;
            font-size: 20px;
            vertical-align: middle;
        }

        /* 좌측 사이드바 (GNB) */
        .sidebar {
            width: 240px;
            background-color: var(--jt-color-surface, #ffffff);
            border-right: 1px solid var(--jt-color-border, #E4E5E8);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-logo {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 var(--jt-space-6, 24px);
            border-bottom: 1px solid var(--jt-color-border, #E4E5E8);
            font-weight: bold;
            font-size: 16px;
        }
        
        .sidebar-menu {
            padding: var(--jt-space-4, 16px);
            display: flex;
            flex-direction: column;
            gap: var(--jt-space-1, 4px);
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: var(--jt-space-2, 8px) var(--jt-space-4, 16px);
            border-radius: var(--jt-r-md, 8px);
            cursor: pointer;
            color: var(--jt-color-text-secondary, #5C6370);
            transition: background-color 0.2s;
            text-decoration: none;
            font-size: 14px;
        }

        .menu-item .material-symbols-rounded {
            margin-right: var(--jt-space-3, 12px);
        }

        .menu-item:hover {
            background-color: var(--jt-color-bg-hover, #F0F2F5);
        }

        .menu-item.active {
            background-color: #EEF2FD; /* Janytree Active bg color */
            color: var(--color-accent, var(--jt-color-accent, #305CDE));
            font-weight: 600;
        }

        /* 우측 메인 영역 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 헤더 */
        .top-header {
            height: 60px;
            background-color: var(--jt-color-surface, #ffffff);
            border-bottom: 1px solid var(--jt-color-border, #E4E5E8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--jt-space-6, 24px);
            flex-shrink: 0;
        }

        .search-bar {
            background-color: var(--jt-color-bg, #F5F6F8);
            border-radius: var(--jt-r-lg, 12px);
            padding: var(--jt-space-2, 8px) var(--jt-space-4, 16px);
            display: flex;
            align-items: center;
            width: 320px;
            color: var(--jt-color-text-tertiary, #8A92A3);
        }
        
        .search-bar input {
            border: none;
            background: none;
            outline: none;
            margin-left: var(--jt-space-2, 8px);
            width: 100%;
            font-family: inherit;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--jt-space-4, 16px);
            color: var(--jt-color-text-secondary, #5C6370);
        }

        .header-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            display: flex;
            align-items: center;
            padding: var(--jt-space-1, 4px);
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: var(--jt-space-2, 8px);
            border-left: 1px solid var(--jt-color-border, #E4E5E8);
            padding-left: var(--jt-space-4, 16px);
            font-size: 13px;
        }

        /* 메인 컨텐츠 영역 */
        .content-area {
            flex: 1;
            padding: var(--jt-space-6, 24px) var(--jt-space-8, 32px);
            overflow-y: auto;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 var(--jt-space-6, 24px) 0;
        }

        /* 뷰 토글을 위한 숨김 클래스 */
        .view-hidden {
            display: none !important;
        }

        /* 카드 컴포넌트 */
        .jt-card {
            background-color: var(--jt-color-surface, #ffffff);
            border-radius: var(--jt-r-lg, 12px);
            border: 1px solid var(--jt-color-border, #E4E5E8);
            padding: var(--jt-space-6, 24px);
            margin-bottom: var(--jt-space-6, 24px);
        }

        .upload-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--jt-space-4, 16px);
        }

        /* 필터 영역 */
        .filter-section {
            display: flex;
            gap: var(--jt-space-4, 16px);
            align-items: center;
        }
        
        .filter-section select {
            height: var(--jt-control-height, 36px);
            border: 1px solid var(--jt-color-border, #D1D5DB);
            border-radius: var(--jt-r-md, 8px);
            padding: 0 var(--jt-space-2, 8px);
            font-family: inherit;
            font-size: 13px;
            color: var(--jt-color-text, #1F2328);
            min-width: 120px;
        }

        /* 버튼류 */
        .btn-primary {
            background-color: var(--color-primary, var(--jt-color-text, #1F2328));
            color: #ffffff;
            border: none;
            border-radius: var(--jt-r-md, 8px);
            padding: 0 var(--jt-space-5, 20px);
            height: var(--jt-control-height, 36px);
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: var(--jt-space-2, 8px);
            transition: opacity 0.2s;
            font-size: 13px;
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-outline {
            background-color: transparent;
            color: var(--jt-color-text, #1F2328);
            border: 1px solid var(--jt-color-border, #D1D5DB);
            border-radius: var(--jt-r-md, 8px);
            padding: 0 var(--jt-space-3, 12px);
            height: var(--jt-control-height, 36px);
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: var(--jt-space-1, 4px);
            font-size: 13px;
        }
        .btn-outline:hover { background-color: var(--jt-color-bg-hover, #F0F2F5); }

        .file-input {
            height: var(--jt-control-height, 36px);
            border: 1px solid var(--jt-color-border, #D1D5DB);
            border-radius: var(--jt-r-md, 8px);
            padding: var(--jt-space-1, 4px) var(--jt-space-2, 8px);
            flex: 1;
            font-size: 13px;
            color: var(--jt-color-text-secondary, #5C6370);
        }

        .file-input::file-selector-button {
            border: 1px solid var(--jt-color-border, #D1D5DB);
            background-color: var(--jt-color-surface, #ffffff);
            border-radius: var(--jt-r-sm, 4px);
            padding: 2px 8px;
            margin-right: 8px;
            cursor: pointer;
            color: var(--jt-color-text, #1F2328);
        }

        /* 테이블 래퍼 커스텀 */
        .jt-table-wrap {
            border: 1px solid var(--jt-color-border, #E4E5E8);
            border-radius: var(--jt-r-md, 8px);
            overflow: hidden;
        }
        
        .jt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .jt-table th {
            background-color: var(--jt-color-bg, #F5F6F8);
            font-weight: 600;
            color: var(--jt-color-text-secondary, #5C6370);
            border-bottom: 1px solid var(--jt-color-border, #E4E5E8);
            padding: var(--jt-space-3, 12px) var(--jt-space-4, 16px);
            text-align: left;
        }
        
        .jt-table td {
            padding: var(--jt-space-3, 12px) var(--jt-space-4, 16px);
            text-align: left;
            border-bottom: 1px solid var(--jt-color-border, #E4E5E8);
        }

        /* 금액 숫자 폰트용 클래스 */
        .jt-num {
            font-family: var(--jt-font-num, Figtree, sans-serif);
            text-align: right !important;
            font-variant-numeric: tabular-nums;
        }

        /* 내부 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: var(--jt-color-surface, #ffffff);
            border-radius: var(--jt-r-lg, 12px);
            padding: var(--jt-space-6, 24px);
            min-width: 400px;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--jt-space-4, 16px);
            border-bottom: 1px solid var(--jt-color-border, #eee);
            padding-bottom: var(--jt-space-3, 12px);
            flex-shrink: 0;
        }
        
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .modal-body {
            line-height: 1.6;
            margin-bottom: var(--jt-space-6, 24px);
            font-size: 14px;
            overflow-y: auto;
        }
        
        .modal-footer {
            text-align: right;
            flex-shrink: 0;
        }

        .empty-message {
            text-align: center;
            padding: var(--jt-space-8, 32px);
            color: var(--jt-color-text-tertiary, #8A92A3);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 (네비게이션 통합) -->
    <header class="top-header">
        <div class="header-left">
            <div class="header-logo">
                JANYTREE 관리비
            </div>
            <nav class="top-nav">
                <a href="#" class="nav-item active" id="menu-dashboard">대시보드 (통계)</a>
                <a href="#" class="nav-item" id="menu-history">명세서 내역</a>
            </nav>
        </div>
        <div class="header-actions">
            <button title="다크모드">
                <span class="material-symbols-rounded">dark_mode</span>
            </button>
            <button title="알림">
                <span class="material-symbols-rounded">notifications</span>
            </button>
        </div>
    </header>

    <!-- 우측 메인 영역 래퍼 제거 (body 직속으로 content-area 배치) -->
    <!-- 메인 컨텐츠 영역 -->
    <main class="content-area">
            
            <!-- 1. 대시보드 뷰 (통계 & 업로드) -->
            <div id="view-dashboard">
                <h1 class="page-title">대시보드</h1>
                
                <!-- [NEW] 이상 급등 알림 영역 -->
                <div id="anomalyAlertsContainer" style="margin-bottom: 24px; display: none; flex-direction: column; gap: 8px;">
                    <!-- 알람 메시지들이 이곳에 들어갑니다 -->
                </div>

                <!-- [NEW] 통계 차트 그리드 영역 -->
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px;">
                    
                    <!-- 차트 1: 월별 총 관리비 추이 -->
                    <div class="jt-card" style="margin-bottom: 0;">
                        <h3 style="margin-top:0; margin-bottom: 16px; font-size: 15px;">월별 총 관리비 추이</h3>
                        <div style="height: 300px;">
                            <canvas id="chartMonthlyTotal"></canvas>
                        </div>
                    </div>

                    <!-- 차트 2: 호수별 누적 비중 -->
                    <div class="jt-card" style="margin-bottom: 0;">
                        <h3 style="margin-top:0; margin-bottom: 16px; font-size: 15px;">호수별 누적 관리비 비중</h3>
                        <div style="height: 300px; display: flex; justify-content: center;">
                            <canvas id="chartRoomShare"></canvas>
                        </div>
                    </div>
                    
                    <!-- 차트 3: 단일 항목 상세 추이 -->
                    <div class="jt-card" style="margin-bottom: 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                            <h3 style="margin: 0; font-size: 15px;">세부 항목별 추이</h3>
                            <select id="analyticsItemSelect" style="height: 28px; border: 1px solid #D1D5DB; border-radius: 4px; font-size: 12px;">
                                <option value="건물관리용역비">건물관리용역비</option>
                            </select>
                        </div>
                        <div style="height: 300px;">
                            <canvas id="chartItemTrend"></canvas>
                        </div>
                    </div>

                    <!-- 차트 4: 전체 항목 비중 -->
                    <div class="jt-card" style="margin-bottom: 0;">
                        <h3 style="margin-top:0; margin-bottom: 16px; font-size: 15px;">전체 항목 비중 (누적)</h3>
                        <div style="height: 300px; display: flex; justify-content: center;">
                            <canvas id="chartItemShare"></canvas>
                        </div>
                    </div>

                </div>

                <div class="jt-card">
                    <h3 style="margin-top:0; margin-bottom: 16px; font-size: 16px;">관리비 명세서 일괄 업로드</h3>
                    <div class="upload-section">
                        <input type="file" id="htmlFileInput" class="file-input" accept=".html" multiple>
                        <button id="uploadBtn" class="btn-primary">
                            <span class="material-symbols-rounded">upload</span>
                            명세서 파싱 및 저장
                        </button>
                    </div>
                </div>

                <!-- 가장 최근 처리된 파싱 결과를 보여줄 테이블 -->
                <div class="jt-card" id="resultContainer" style="display: none;">
                    <h3 id="resultTitle" style="margin-top:0; margin-bottom: 16px; font-size: 16px;"></h3>
                    <div class="jt-table-wrap">
                        <table class="jt-table">
                            <thead>
                                <tr>
                                    <th>항목명</th>
                                    <th style="text-align: right;">금액(원)</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 2. 명세서 내역 뷰 (조회) -->
            <div id="view-history" class="view-hidden">
                <h1 class="page-title">명세서 내역</h1>
                <div class="jt-card" style="margin-bottom: 24px; padding: 16px 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="filter-section">
                            <span style="font-weight:600; font-size:14px; margin-right:8px;">호수</span>
                            <select id="filterRoom">
                                <option value="ALL">전체 호수</option>
                            </select>
                            
                            <span style="font-weight:600; font-size:14px; margin-right:8px; margin-left:16px;">청구 월</span>
                            <select id="filterMonth">
                                <option value="ALL">전체 월</option>
                            </select>

                            <span style="font-weight:600; font-size:14px; margin-right:8px; margin-left:16px;">비교 항목</span>
                            <select id="filterItem" style="min-width: 160px;">
                                <option value="ALL">모든 항목 보기</option>
                            </select>
                        </div>
                        
                        <button class="btn-primary" id="compareBtn" disabled>
                            <span class="material-symbols-rounded">bar_chart</span> 
                            비교할 2개 이상을 체크하세요 (0)
                        </button>
                    </div>

                    <!-- 기존 테이블 래퍼 대신 카드 그리드 영역 사용 -->
                    <div id="historyCardsContainer" style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- 카드들이 여기에 동적으로 들어갑니다 -->
                    </div>
                </div>
            </div>
            
            <!-- 3. 관리 설정 뷰 -->
            <div id="view-settings" class="view-hidden">
                <h1 class="page-title">관리 설정</h1>
                <div class="jt-card">
                    <div class="empty-message">
                        <span class="material-symbols-rounded" style="font-size: 48px; color: #E4E5E8; margin-bottom: 16px; display: block;">construction</span>
                        관리 설정 기능은 준비 중입니다.
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 결과 알림 모달 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>처리 완료</h3>
                <button style="background:none;border:none;cursor:pointer;color:#8A92A3;" onclick="closeResultModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body" id="modalMessage">
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeResultModal()">확인</button>
            </div>
        </div>
    </div>

    <!-- 상세 보기 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="detailModalTitle">상세 내역</h3>
                <button style="background:none;border:none;cursor:pointer;color:#8A92A3;" onclick="closeDetailModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="jt-table-wrap">
                    <table class="jt-table">
                        <thead>
                            <tr>
                                <th>항목명</th>
                                <th style="text-align: right;">금액(원)</th>
                            </tr>
                        </thead>
                        <tbody id="detailModalBody">
                        </tbody>
                        <tfoot id="detailModalFoot" style="font-weight: bold; background-color: var(--jt-color-bg, #F5F6F8);">
                        </tfoot>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" onclick="closeDetailModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- 비교 차트 모달 -->
    <div class="modal-overlay" id="compareModal">
        <div class="modal-card" style="max-width: 800px; width: 100%;">
            <div class="modal-header" style="flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <h3 id="compareModalTitle" style="margin: 0;">명세서 비교 차트</h3>
                    <select id="compareItemFilter" style="height: 28px; border: 1px solid #D1D5DB; border-radius: 4px; font-size: 13px;">
                        <option value="ALL">전체 항목 보기</option>
                    </select>
                </div>
                <button style="background:none;border:none;cursor:pointer;color:#8A92A3;" onclick="closeCompareModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="modal-body">
                <canvas id="compareChart" height="400"></canvas>
            </div>
            <div class="modal-footer">
                <button class="btn-outline" onclick="closeCompareModal()">닫기</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
